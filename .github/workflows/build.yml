name: Build and verify PoC
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  poc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
      - name: Android platform
        shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build, tests, lint and interoperability
        shell: pwsh
        run: ./scripts/build.ps1 -Interop -JavaHome $env:JAVA_HOME
      - uses: actions/upload-artifact@v4
        with:
          name: LegacyDisplay-v0.1
          path: artifacts/
